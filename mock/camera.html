<!doctype html><html><head><meta charset=utf-8>
<link rel=stylesheet href="_base.css"><style>
html,body{width:860px;height:540px;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;
 background:radial-gradient(700px 400px at 50% 0%,rgba(157,108,255,.06),transparent 60%),#080C12;padding:26px}
.modal{background:linear-gradient(180deg,#161E2B,#101621);border:1px solid rgba(176,192,220,.26);
 border-radius:20px;box-shadow:0 26px 80px rgba(0,0,0,.5);width:100%;max-width:760px;padding:26px}
.modal h3{font-size:19px;font-weight:750;letter-spacing:-.025em;margin-bottom:6px}
.modal .s{color:#A8B2C3;font-size:13px;line-height:1.55;margin-bottom:20px}
.foot{display:flex;gap:10px;margin-top:22px}
.foot .g{flex:1}

</style></head><body><div class=modal><h3>🎥 Camera setup</h3>
<div class=s>The green box is what appears at the TOP of the clip. Fit it around the streamer camera — or let Jolnova find it.</div>
<div class="g7" style="aspect-ratio:16/9;border-radius:13px;position:relative;overflow:hidden;
 border:1px solid rgba(146,163,190,.16)">
 <span style="position:absolute;left:4%;top:6%;width:26%;height:42%;border:2px solid var(--acc);border-radius:9px;
  background:color-mix(in srgb,var(--acc) 9%,transparent);box-shadow:0 0 22px color-mix(in srgb,var(--acc) 22%,transparent)">
  <span style="position:absolute;left:8px;top:7px;background:rgba(6,9,13,.8);color:var(--acc);border-radius:5px;
   padding:2px 7px;font-size:10px;font-weight:800">CAMERA</span>
  <span style="position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;border-radius:4px;background:var(--acc);border:2px solid #0B1018"></span></span>
 <span style="position:absolute;right:5%;bottom:8%;background:rgba(6,9,13,.78);border:1px solid rgba(146,163,190,.2);
  border-radius:8px;padding:5px 11px;font-size:11px;color:#A8B2C3">Frame from the live stream</span></div>
<div class=foot><span class=btns>Grab a new frame</span><span class=btns>🤖 Auto-detect</span>
 <span class=g></span><button class=btnp style="padding:11px 26px">Save camera box</button></div></div></body></html>
