html,body{width:900px;height:640px;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;
 background:radial-gradient(700px 400px at 50% 0%,rgba(157,108,255,.06),transparent 60%),#080C12;padding:26px}
.modal{background:linear-gradient(180deg,#161E2B,#101621);border:1px solid rgba(176,192,220,.26);

</style></head><body><div class=modal><h3>✂️ Trim clip</h3>
<div class=s>Drag the handles to cut the start and the end. The rest of the clip is untouched.</div>
<div class="g4" style="height:150px;border-radius:12px;position:relative;overflow:hidden;
 border:1px solid rgba(146,163,190,.16)">
 <span style="position:absolute;inset:0;background:rgba(5,7,11,.55)"></span>
 <span style="position:absolute;left:16%;right:12%;top:0;bottom:0;border-left:3px solid var(--acc);
  border-right:3px solid var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent);box-shadow:0 0 24px color-mix(in srgb,var(--acc) 20%,transparent) inset"></span>
 <span style="position:absolute;left:16%;top:50%;transform:translate(-50%,-50%);width:12px;height:44px;
  border-radius:5px;background:var(--acc);box-shadow:0 0 12px color-mix(in srgb,var(--acc) 60%,transparent)"></span>
 <span style="position:absolute;left:88%;top:50%;transform:translate(-50%,-50%);width:12px;height:44px;
  border-radius:5px;background:var(--acc);box-shadow:0 0 12px color-mix(in srgb,var(--acc) 60%,transparent)"></span>
 <span style="position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(6,9,13,.82);
  border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);color:var(--acc);border-radius:8px;padding:4px 12px;font-size:12px;font-weight:750">17.4s selected</span>
</div>
<div style="display:flex;justify-content:space-between;color:#747F92;font-size:11.5px;margin-top:9px;font-variant-numeric:tabular-nums">
 <span>00:00</span><span>Start 00:04.1</span><span>End 00:21.5</span><span>00:24</span></div>
<div style="display:flex;gap:16px;margin-top:20px">
 <div style="flex:1"><div style="color:#747F92;font-size:10.5px;font-weight:750;letter-spacing:.1em;margin-bottom:8px">TRIM FROM START</div>
  <div style="height:6px;border-radius:4px;background:#1B2431;position:relative">
   <span style="position:absolute;left:0;width:18%;height:100%;border-radius:4px;background:var(--acc)"></span>
   <span style="position:absolute;left:18%;top:-5px;width:16px;height:16px;border-radius:50%;background:var(--acc);transform:translateX(-50%)"></span></div></div>
 <div style="flex:1"><div style="color:#747F92;font-size:10.5px;font-weight:750;letter-spacing:.1em;margin-bottom:8px">TRIM FROM END</div>
  <div style="height:6px;border-radius:4px;background:#1B2431;position:relative">
   <span style="position:absolute;left:0;width:11%;height:100%;border-radius:4px;background:var(--acc)"></span>
   <span style="position:absolute;left:11%;top:-5px;width:16px;height:16px;border-radius:50%;background:var(--acc);transform:translateX(-50%)"></span></div></div>
</div>
<div class=foot><span class=btns>Cancel</span><span class=g></span><button class=btnp style="padding:11px 26px">Apply trim</button></div></div><script src="_sozluk.js"></script><script src="_i18n.js"></script></body></html>
